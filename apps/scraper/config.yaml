    - "finance jobs"
    - "healthcare jobs"
    - "engineering jobs"
    - "design jobs"
    - "internship jobs"
    - "entry level jobs"
    - "remote jobs"
    - "part time jobs"
    - "contract jobs"

  locations:
    - "United States"
    - "United Kingdom"
    - "Canada"
    - "Germany"
    - "Australia"
    - "India"
    - "France"
    - "Netherlands"
    - "Singapore"
    - "UAE"

  country_indeed: "USA"
  job_type: ~
  is_remote: false
  distance: ~
  hours_old: ~
  easy_apply: ~
  results_wanted: 50
  linkedin_fetch_description: false
  enforce_annual_salary: false
  description_format: "markdown"

# ─── SCHEDULING ─────────────────────────────────────────────────────────────
schedule:
  interval_seconds: 7200    # 2 hours between cycles
  jitter_percent: 20        # ±20% random variance

# ─── PROXY CONFIG ───────────────────────────────────────────────────────────
proxies:
  method: both               # 'file', 'auto', or 'both'
  file_path: "proxies.txt"
  auto_fetch:
    enabled: true
    refresh_interval: 1800
    max_proxies: 80
    test_timeout: 5
    sources: ~

# ─── USER AGENT ROTATION ────────────────────────────────────────────────────
user_agent:
  rotate: true
  custom_list: []

# ─── REQUEST DELAYS ─────────────────────────────────────────────────────────
delays:
  pre_cycle_min: 3
  pre_cycle_max: 10

# ─── LOGGING ────────────────────────────────────────────────────────────────
logging:
  level: "INFO"              # DEBUG, INFO, WARNING, ERROR
  format: "structured"       # 'structured' (JSON) or 'text'
