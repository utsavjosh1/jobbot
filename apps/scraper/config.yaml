# ============================================================================
# Postly Scraper — Configuration
# ============================================================================
# The scraper runs 24/7, cycling through search terms × locations across all
# supported platforms. Results are written directly to the PostgreSQL database.
# ============================================================================

# ─── DATABASE CONNECTION ──────────────────────────────────────────────────────
# Override via environment variables: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
database:
  host: "localhost"
  port: 5432
  name: "postly"
  user: "postgres"
  password: "postgres"
  # Connection pool settings
  min_connections: 2
  max_connections: 5

# ─── SCRAPER ENGINE ───────────────────────────────────────────────────────────
search:
  site_name:
    - linkedin
    - indeed
    - zip_recruiter
    - glassdoor
    - google
    - bayt
    - naukri
    - bdjobs

