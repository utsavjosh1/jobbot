services:

  # ─── API Server ────────────────────────────────────────────
  api:
    image: ${API_IMAGE:-utsavjoshi/postly-api:latest}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: postly-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: "--max-old-space-size=384"
      # ── Shared PostgreSQL (from monitoring stack) ──
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postly
      DB_USER: postly
      DB_PASSWORD: ${POSTLY_DB_PASSWORD:?POSTLY_DB_PASSWORD required}
      DATABASE_URL: postgresql://postly:${POSTLY_DB_PASSWORD}@postgres:5432/postly
      # ── Shared Redis (from monitoring stack) ──
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # ── Auth ──
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT refresh secret required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      WEB_URL: ${WEB_URL:-http://localhost}
      # ── AI ──
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # ── Server ──
      API_PORT: 3000
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (res) => { if (res.statusCode !== 200) process.exit(1); }).on('error', () => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_nw
    ports:
      - "3000:3000"

  # ─── Scraper (Python + Playwright) ────────────────────────
  scraper:
    image: ${SCRAPER_IMAGE:-utsavjoshi/postly-scraper:latest}
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    container_name: postly-scraper
    restart: unless-stopped
    environment:
      # ── Shared PostgreSQL (from monitoring stack) ──
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postly
      DB_USER: postly
      DB_PASSWORD: ${POSTLY_DB_PASSWORD:?POSTLY_DB_PASSWORD required}
      DATABASE_URL: postgresql://postly:${POSTLY_DB_PASSWORD}@postgres:5432/postly
      # ── AI ──
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # ── Health ──
      HEALTH_PORT: 8080
    shm_size: '512mb'
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 400M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_nw

  # ─── Discord Bot ───────────────────────────────────────────
  bot:
    image: ${BOT_IMAGE:-utsavjoshi/postly-bot:latest}
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    container_name: postly-bot
    restart: unless-stopped
    environment:
      # ── Shared PostgreSQL (from monitoring stack) ──
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postly
      DB_USER: postly
      DB_PASSWORD: ${POSTLY_DB_PASSWORD:?POSTLY_DB_PASSWORD required}
      DATABASE_URL: postgresql://postly:${POSTLY_DB_PASSWORD}@postgres:5432/postly
      # ── Shared Redis (from monitoring stack) ──
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      # ── Discord ──
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?Discord bot token required}
      WEB_URL: ${WEB_URL:-http://localhost}
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 200M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring_nw

volumes: {}

networks:
  monitoring_nw:
    name: monitoring_nw
    external: true
