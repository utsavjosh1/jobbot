name: Continuous Deployment (CD)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /var/www/postly

            # Pull latest code
            git fetch --all
            git reset --hard origin/main

            # ── Load all required env vars ──────────────────────────
            # 1. Shared monitoring credentials (DB + Redis passwords)
            if [ -f /var/www/monitoring/.env ]; then
              echo "📦 Sourcing monitoring/.env for shared credentials..."
              set -a
              . /var/www/monitoring/.env
              set +a
            elif [ -f /opt/monitoring/.env ]; then
              echo "📦 Sourcing /opt/monitoring/.env for shared credentials..."
              set -a
              . /opt/monitoring/.env
              set +a
            else
              echo "❌ monitoring/.env not found — POSTLY_DB_PASSWORD and REDIS_PASSWORD required"
              exit 1
            fi

            # 2. Postly-specific secrets (JWT, API keys, etc.)
            #    These can either be in postly's own .env or passed as GH Secrets
            if [ -f .env ]; then
              echo "📦 Sourcing postly/.env for app secrets..."
              set -a
              . ./.env
              set +a
            fi

            # 3. Override with GitHub Secrets where provided (highest priority)
            [ -n "${{ secrets.JWT_SECRET }}" ]          && export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            [ -n "${{ secrets.JWT_REFRESH_SECRET }}" ]  && export JWT_REFRESH_SECRET="${{ secrets.JWT_REFRESH_SECRET }}"
            [ -n "${{ secrets.DISCORD_BOT_TOKEN }}" ]   && export DISCORD_BOT_TOKEN="${{ secrets.DISCORD_BOT_TOKEN }}"
            [ -n "${{ secrets.OPENAI_API_KEY }}" ]      && export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            [ -n "${{ secrets.VOYAGE_API_KEY }}" ]      && export VOYAGE_API_KEY="${{ secrets.VOYAGE_API_KEY }}"

            # Validate required vars
            : "${POSTLY_DB_PASSWORD:?POSTLY_DB_PASSWORD not set}"
            : "${REDIS_PASSWORD:?REDIS_PASSWORD not set}"
            : "${JWT_SECRET:?JWT_SECRET not set}"
            : "${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET not set}"

            # ── Build and deploy ─────────────────────────────────────
            echo "🔨 Building images..."
            docker compose -f docker-compose.prod.yml build --no-cache

            echo "🚀 Starting services..."
            docker compose -f docker-compose.prod.yml up -d

            # Wait for API to become healthy
            echo "⏳ Waiting for API health check..."
            RETRIES=10
            DELAY=5
            for i in $(seq 1 $RETRIES); do
              if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
                echo "✅ API is healthy (attempt $i/$RETRIES)"
                break
              fi
              if [ $i -eq $RETRIES ]; then
                echo "❌ API health check failed after $RETRIES attempts"
                echo "--- Last 50 lines of API logs ---"
                docker compose -f docker-compose.prod.yml logs api --tail=50
                exit 1
              fi
              echo "⏳ Attempt $i/$RETRIES failed, retrying in ${DELAY}s..."
              sleep $DELAY
            done

            # Run database migrations (if any)
            docker exec postly-api npm run migrate:up || echo "No migrations to run"

            # Rebuild other services
            docker compose -f docker-compose.prod.yml up -d --build scraper bot

            # Cleanup
            docker image prune -f

            echo "🚀 Deployment complete"
